[project]
name = "service-c"
version = "0.1.0"  # managed by release-please (python release-type)
description = "service-c — Python + FastAPI demo service."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "common",  # live-at-head workspace lib (see root [tool.uv.sources])
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/service_c"]
