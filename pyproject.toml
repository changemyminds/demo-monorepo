[project]
name = "demo-monorepo"
version = "0"
description = "Demo monorepo (Python workspace root)."
requires-python = ">=3.11"

# Virtual root: the repo root is not itself an installable package, it only
# defines the workspace that ties the Python services to the shared lib.
[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "libs/python/common",
  "apps/service-c",
  "apps/service-d",
]

# Resolve `common` to the live-at-head workspace source everywhere.
[tool.uv.sources]
common = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "httpx>=0.27",  # required by fastapi.testclient
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["libs/python", "apps/service-c", "apps/service-d"]
# importlib mode lets same-named test files (test_main.py) coexist across packages.
addopts = "--import-mode=importlib"
